<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mood Techno Chat</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main>
        <div class="mood-selector">
            <button class="mood-btn" data-mood="happy" title="Glücklich">😊</button>
            <button class="mood-btn" data-mood="sad" title="Traurig">😢</button>
            <button class="mood-btn" data-mood="energetic" title="Voller Energy">⚡</button>
            <button class="mood-btn" data-mood="chill" title="Chill">😌</button>
            <button class="mood-btn" data-mood="romatic" title="Romantisch">💕</button>
            <button class="mood-btn" data-mood="angry" title="Wütend">😡</button>
        </div>
        
        <div class="chat-container">
            <div class="chat-header">
                <h1>🎵 Techno Mood Chat</h1>
                <div class="current-mood">Wähle dein Mood aus → <span class="mood-indicator">🎭</span></div>
            </div>
            
            <div class="chat-history"></div>
            
            <div class="chat-input">
                <form id="chatForm">
                    <input type="text" name="content" placeholder="Erzähl mir von deinem Tag..." />
                    <button type="submit">Send</button>
                </form>
            </div>
            
            <div class="audio-player">
                <audio id="technoPlayer" controls>
                    <source id="audioSource" src="" type="audio/mp3" />
                    Your browser does not support the audio element.
                </audio>
            </div>
        </div>
    </main>

    <script src="index.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mood Techno Chat</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>
    <main>
        <div class="mood-selector">
            <button class="mood-btn" data-mood="happy" title="Happy">😊</button>
            <button class="mood-btn" data-mood="sad" title="Sad">😢</button>
            <button class="mood-btn" data-mood="energetic" title="Energetic">⚡</button>
            <button class="mood-btn" data-mood="chill" title="Chill">😌</button>
            <button class="mood-btn" data-mood="romatic" title="Romantic">💕</button>
            <button class="mood-btn" data-mood="angry" title="Angry">😡</button>
        </div>
        
        <div class="chat-container">
            <div class="chat-header">
                <h1>🎵 Techno Mood Chat</h1>
                <div class="current-mood">Wähle dein Mood aus → <span class="mood-indicator">🎭</span></div>
            </div>
            
            <div class="chat-history"></div>
            
            <div class="chat-input">
                <form id="chatForm">
                    <input type="text" name="content" placeholder="Erzähl mir von deinem Tag..." />
                    <button type="submit">Send</button>
                </form>
            </div>
            
            <div class="audio-player">
                <audio id="technoPlayer" controls>
                    <source id="audioSource" src="" type="audio/mp3" />
                    Your browser does not support the audio element.
                </audio>
            </div>
        </div>
    </main>

    <script src="index.js"></script>

    <div id="backlink">
		<style>
			#backlink {
				--color-accent: hsl(198, 100%, 50%);
				position: absolute;
				top: 8px;
				right: 8px;
				border: 1px dashed black;
				background-color: white;
				padding: 8px;
				cursor: pointer;
				color: black;
				font-size: 0.8rem;
				font-weight: bold;
				transition: all 0.3s ease;
				transform: rotate(-2deg) scale(0.9);
				box-shadow: 0 0 10px 0 rgba(0, 0, 0, 0.5);
				a {
					text-decoration: none;
					color: black;
					color: inherit;
					text-decoration: underline;
					background-image: linear-gradient(to right,
							var(--color-accent) 0%,
							var(--color-accent) 100%);
					background-size: 0% 100%;
					background-position: left center;
					background-repeat: no-repeat;
					transition: background-size 0.2s ease-in-out;
					padding: 0.5rem;
				}
				a:hover {
					background-size: 100% 100%;
					color: white;
				}

			}
			#backlink:hover {
				transform: rotate(2deg) scale(1);
			}
		</style>
		<a href="https://rundgang2025.qawsed.site">Back to the Rundgang 2025</a>
	</div>
    
</body>
</html>
